
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Pikachu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #e8f5ff;
            color: #263653;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        [hidden] {
            display: none !important;
        }

        .screen {
            min-height: 100vh;
            padding: 22px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-container {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        .game-logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 28px;
            background: #ffe16a;
            box-shadow: 0 7px 0 #e7b83e;
            font-size: 60px;
        }

        h1 {
            margin: 28px 0;
            color: #315da8;
            font-size: clamp(34px, 6vw, 54px);
            letter-spacing: 3px;
        }

        .menu-panel {
            max-width: 650px;
            margin: 0 auto;
            padding: 24px;
            border: 1px solid #e2eaf4;
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 12px 35px rgba(51, 83, 125, .12);
        }

        .menu-button {
            width: 100%;
            min-height: 48px;
            margin: 6px 0;
            padding: 12px 16px;
            border: 2px solid transparent;
            border-radius: 12px;
            background: #f0f5fc;
            color: #31517e;
            font-weight: bold;
            transition: transform .15s, box-shadow .15s;
        }

        .menu-button:hover {
            background: #e2edff;
        }

        .menu-button.primary,
        .menu-button.primary:hover {
            background: #ffcf43;
            color: #493711;
        }

        .menu-button.primary:hover {
            box-shadow: 0 4px 0 #e5b52c;
            transform: translateY(-1px);
        }

        .section-title {
            color: #315da8;
        }

        .level-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            text-align: left;
        }

        .level-option {
            min-width: 0;
        }

        .level-button {
            width: 100%;
            min-height: 105px;
            padding: 14px;
            border: 2px solid #dce7f5;
            border-radius: 14px;
            background: #f8fbff;
            color: #31517e;
            text-align: left;
        }

        .level-button.selected {
            border-color: #e8b62e;
            background: #fff5cc;
        }

        .help-content {
            margin-top: 14px;
            padding: 13px 15px;
            border-radius: 10px;
            background: #f5f8ff;
            color: #334b70;
            line-height: 1.6;
            text-align: left;
        }

        .level-name {
            display: block;
            margin-bottom: 8px;
            font-size: 17px;
            font-weight: bold;
        }

        .game-container {
            width: 100%;
            max-width: 1150px;
            text-align: center;
        }

        .game-header {
            margin-bottom: 14px;
        }

        .game-header h2 {
            color: #315da8;
        }

        .game-time {
            max-width: 760px;
            margin: 0 auto 15px;
            padding: 10px 14px;
            border: 1px solid #dce7f5;
            border-radius: 12px;
            background: #fff;
            text-align: left;
        }

        .game-time-info {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 7px;
            color: #405777;
            font-size: 13px;
        }

        .game-time-track {
            height: 12px;
            overflow: hidden;
            border-radius: 20px;
            background: #e8edf5;
        }

        .game-time-bar {
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background: #43b581;
            transition: width .25s linear, background .25s linear;
        }

        .game-time-bar.warning {
            background: #e74c3c;
        }

        .status-line {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }

        .status-item {
            padding: 8px 12px;
            border-radius: 9px;
            background: #fff;
        }

        .game-toolbar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .small-button {
            padding: 10px 14px;
            border: 0;
            border-radius: 9px;
            background: #315da8;
            color: #fff;
            font-weight: bold;
        }

        .small-button:hover {
            background: #254984;
        }

        .small-button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .game-layout {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1150px;
            margin: 0 auto;
        }

        .game-layout .game-board {
            flex: 1 1 auto;
            min-width: 0;
        }

        .memory-panel {
            flex: 0 0 150px;
            min-height: 245px;
            padding: 14px 10px;
            border: 1px solid #d7e3f4;
            border-radius: 16px;
            background: linear-gradient(160deg, #ffffff, #f3f7ff);
            box-shadow: 0 8px 22px rgba(51, 83, 125, .12);
            text-align: center;
        }

        .memory-panel-title {
            margin: 0 0 6px;
            color: #315da8;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .memory-panel-description {
            min-height: 34px;
            margin: 0 0 10px;
            color: #71809a;
            font-size: 11px;
            line-height: 1.45;
        }

        .memory-hint {
            min-height: 30px;
            margin: 10px 0 0;
            color: #687993;
            font-size: 11px;
            line-height: 1.4;
        }

        .game-board {
            position: relative;
            width: min(100%, 960px);
            aspect-ratio: 16 / 9;
            margin: 0 auto;
            overflow: hidden;
            border: 4px solid #b8cce7;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(51, 83, 125, .12);
        }

        #game {
            width: 100%;
            height: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        #game tr {
            height: 11.111111%;
        }

        .cell {
            position: relative;
            width: 6.25%;
            height: 11.111111%;
            padding: 0;
            overflow: hidden;
            border: 1px solid #a9b7ca;
            background: #fff;
            text-align: center;
            vertical-align: middle;
            user-select: none;
        }

        .cell img {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 44px;
            max-height: 44px;
            margin: auto;
            object-fit: contain;
            pointer-events: none;
        }

        .cell.selected {
            background: #ffe16a;
            box-shadow: inset 0 0 0 2px #e4a91b;
        }

        .cell.hint {
            background: #a9f3c5 !important;
        }

        .cell.hidden-tile {
            background: #dceaff;
            color: #315da8;
            font-size: clamp(10px, 2vw, 24px);
            font-weight: bold;
        }

        .cell.blocked {
            background: #9eafc5;
            opacity: .78;
        }

        .cell.memory {
            outline: 3px solid var(--memory-color);
            outline-offset: -3px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .75);
        }

        .cell.shuffle-animate {
            z-index: 4;
            animation: cardShuffle .72s ease-in-out var(--shuffle-delay, 0ms) both;
        }

        @keyframes cardShuffle {
            0% {
                transform: translateY(0) rotate(0) scale(1);
            }

            20% {
                transform: translateY(-5px) rotate(-4deg) scale(1.06);
            }

            45% {
                transform: translateY(2px) rotate(6deg) scale(.94);
            }

            70% {
                transform: translateY(-2px) rotate(-3deg) scale(1.03);
            }

            100% {
                transform: translateY(0) rotate(0) scale(1);
            }
        }

        .cell.tile-flip-out {
            animation: tileFlipOut .42s ease-in both;
            transform-style: preserve-3d;
        }

        .cell.tile-flip-in {
            animation: tileFlipIn .42s ease-out both;
            transform-style: preserve-3d;
        }

        @keyframes tileFlipOut {
            0% {
                transform: perspective(400px) rotateY(0);
            }

            50% {
                transform: perspective(400px) rotateY(90deg);
            }

            100% {
                transform: perspective(400px) rotateY(0);
            }
        }

        @keyframes tileFlipIn {
            0% {
                transform: perspective(400px) rotateY(90deg) scale(.94);
            }

            100% {
                transform: perspective(400px) rotateY(0) scale(1);
            }
        }

        .cell.tile-disappear {
            animation: tilePopAway .48s cubic-bezier(.2,.8,.3,1.2) both;
        }

        @keyframes tilePopAway {
            0% {
                opacity: 1;
                transform: scale(1);
                filter: brightness(1);
            }

            35% {
                opacity: 1;
                transform: scale(1.13);
                filter: brightness(1.8);
            }

            100% {
                opacity: 0;
                transform: scale(.05) rotate(18deg);
                filter: brightness(2);
            }
        }

        .cell.bomb-countdown {
            z-index: 1;
            border: 3px solid #e53935 !important;
            animation: bombPulse .65s infinite alternate;
        }

        @keyframes bombPulse {
            from {
                box-shadow: inset 0 0 0 1px #ffb4b4;
            }

            to {
                box-shadow: inset 0 0 0 4px #e53935;
            }
        }

        .cell.bomb-countdown::before {
            content: attr(data-seconds);
            position: absolute;
            right: 1px;
            bottom: 0;
            z-index: 2;
            padding: 1px 3px;
            border-radius: 4px;
            background: #e53935;
            color: white;
            font-size: clamp(8px, 1vw, 12px);
            font-weight: bold;
        }

        .cell.bomb-lucky {
            border-color: #2eae63;
        }

        .cell.bomb-unlucky {
            border-color: #e05252;
        }

        .preview-countdown {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(22, 42, 75, .22);
            color: #fff;
            font-size: clamp(60px, 12vw, 120px);
            font-weight: bold;
            text-shadow: 0 4px 12px rgba(0, 0, 0, .6);
            pointer-events: none;
        }

        .game-note {
            min-height: 24px;
            margin-top: 12px;
            color: #526782;
            font-size: 14px;
        }

        .memory-card {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 112px;
            height: 158px;
            padding: 0;
            overflow: hidden;
            border: 3px solid #f0b900;
            border-radius: 12px;
            background: #fff8d9;
            box-shadow: 0 5px 0 #dca900, 0 9px 16px rgba(69, 49, 110, .18);
            color: #6336a5;
            font-weight: bold;
            vertical-align: middle;
            transition: border-color .25s, box-shadow .25s, transform .25s;
        }

        .memory-card-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .memory-progress {
            position: absolute;
            z-index: 1;
            right: 0;
            bottom: 0;
            left: 0;
            height: 100%;
            background: rgba(255, 218, 45, .62);
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform .9s linear;
            pointer-events: none;
        }

        .memory-combo {
            position: absolute;
            z-index: 2;
            right: 3px;
            bottom: 5px;
            left: 3px;
            padding: 4px 2px;
            border-radius: 6px;
            background: rgba(255, 255, 255, .92);
            color: #493711;
            font-size: 12px;
            line-height: 1.2;
            text-align: center;
        }

        .memory-card.memory-ready {
            border-color: #f0b900;
            background: #ffe16a;
            box-shadow: 0 0 0 4px rgba(255, 216, 77, .28),
            0 0 22px rgba(255, 190, 0, .9),
            0 5px 0 #dca900;
            transform: translateY(-2px) scale(1.04);
            cursor: pointer;
            animation: memoryReadyGlow 1.2s ease-in-out infinite alternate;
        }

        .memory-card.memory-ready .memory-combo {
            background: #ffe16a;
            color: #553c00;
        }

        .memory-card.memory-active {
            border-color: #f0b900;
            box-shadow: 0 0 0 4px rgba(255, 216, 77, .28),
            0 0 22px rgba(255, 190, 0, .9),
            0 5px 0 #dca900;
            animation: none;
        }

        .memory-timer {
            position: absolute;
            z-index: 2;
            top: 7px;
            right: 7px;
            min-width: 36px;
            padding: 5px 6px;
            border-radius: 20px;
            background: #1f9d68;
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
        }

        @keyframes memoryReadyGlow {
            from {
                filter: brightness(1);
            }

            to {
                filter: brightness(1.12);
            }
        }

        .memory-card:disabled {
            opacity: .92;
            cursor: default;
        }

        @media (max-width: 600px) {
            .menu-panel {
                padding: 16px;
            }

            .level-list {
                grid-template-columns: 1fr;
            }

            .game-layout {
                flex-direction: column-reverse;
                align-items: center;
                gap: 12px;
            }

            .game-layout .game-board {
                width: 100%;
                flex: none;
                aspect-ratio: 4 / 3;
            }

            .memory-panel {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                gap: 8px 12px;
                width: 100%;
                min-height: auto;
                padding: 10px;
            }

            .memory-panel-title,
            .memory-panel-description,
            .memory-hint {
                margin: 0;
            }

            .memory-panel-description {
                max-width: 110px;
            }

            .memory-card {
                width: 76px;
                height: 106px;
            }

            .cell {
                padding: 0;
            }

            .cell img {
                max-width: 100%;
                max-height: 100%;
            }

            .small-button {
                padding: 9px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<section id="home-screen" class="screen">
    <div class="menu-container">
        <div class="game-logo" aria-hidden="true">⚡</div>
        <h1>PIKACHU</h1>

        <div class="menu-panel">
            <button id="start-button" class="menu-button primary">
                BẮT ĐẦU CHƠI
            </button>

            <button id="choose-level-button" class="menu-button">
                CHỌN LEVEL
            </button>
        </div>
    </div>
</section>

<section id="level-screen" class="screen" hidden>
    <div class="menu-container">
        <div class="menu-panel">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
                <h2 class="section-title">Chọn Level</h2>
                <button id="close-level-button" class="small-button"
                        aria-label="Đóng chọn level">✕</button>
            </div>

            <div class="level-list">

                <div class="level-option">
                    <button class="level-button selected" data-level="1"
                            data-help="Ghép hai ô có hình giống nhau bằng đường nối hợp lệ để loại bỏ chúng và ghi điểm. Sử dụng gợi ý hoặc đổi vị trí khi cần."
                            aria-pressed="true">
                        <span class="level-name">Level 1 — Cổ Điển</span>
                    </button>
                </div>

                <div class="level-option">
                    <button class="level-button" data-level="2"
                            data-help="Một quả bom xuất hiện ngẫu nhiên trên bàn chơi và đếm ngược trong 15 giây. Nếu không tiêu diệt ô chứa bom kịp thời, bom sẽ phát nổ và làm xáo trộn vị trí các ô xung quanh."
                            aria-pressed="false">
                        <span class="level-name">Level 2 — Bom Đếm Ngược</span>
                    </button>
                </div>

                <div class="level-option">
                    <button class="level-button" data-level="3"
                            data-help="Một số ô hình bị úp lại, trong đó có 2 bom may mắn và 2 bom xui rủi. Bom may mắn giúp loại bỏ các ô xung quanh, bom xui rủi khiến các ô xung quanh bị úp lại."
                            aria-pressed="false">
                        <span class="level-name">Level 3 — Bom May Rủi</span>
                    </button>
                </div>

                <div class="level-option">
                    <button class="level-button" data-level="4"
                            data-help="Tất cả ô đều bị úp. Dùng gợi ý hoặc quan sát các ô cùng màu lần lượt xuất hiện để tìm 2 cặp ô giống nhau và kích hoạt Thẻ Ký Ức. Thẻ mở toàn bộ ô trong 15 giây. Trong thời gian này, ghép thêm 2 cặp để đặt lại thời gian thẻ về 15 giây. Nếu hết giờ, tất cả ô sẽ bị úp lại và bạn phải kích hoạt thẻ lần nữa."
                            aria-pressed="false">
                        <span class="level-name">Level 4 — Ký Ức Vô Tận</span>
                    </button>
                </div>

            </div>

            <div class="help-content">
                <strong>Hướng dẫn chơi</strong>
                <p id="level-help-content">

                </p>
            </div>

            <button id="play-level-button" class="menu-button primary">
                CHƠI
            </button>

            <button id="back-level-button" class="menu-button">
                QUAY LẠI
            </button>
        </div>
    </div>
</section>

<section id="game-screen" class="screen" hidden>
    <div class="game-container">
        <div class="game-header">
            <h2 id="game-title">PIKACHU</h2>

            <div class="status-line">
                <span class="status-item">
                    Điểm: <b id="current-score">0</b>
                </span>

                <span class="status-item">
                    Lượt đổi: <b id="shuffle-count">7</b>
                </span>

                <span class="status-item">
                    Gợi ý: <b id="hint-count">5</b>
                </span>
            </div>
        </div>

        <div class="game-time" aria-label="Thời gian chơi còn lại">
            <div class="game-time-info">
                <span>Thời gian còn lại</span>
                <strong id="game-time-text">480s</strong>
            </div>

            <div class="game-time-track">
                <div id="game-time-bar" class="game-time-bar"></div>
            </div>
        </div>

        <div class="game-toolbar">
            <button id="restart-button" class="small-button">
                Chơi lại
            </button>

            <button id="change-level-button" class="small-button">
                Chọn Level
            </button>

            <button id="shuffle-button" class="small-button">
                Đổi vị trí (7)
            </button>

            <button id="hint-button" class="small-button">
                Gợi ý (5)
            </button>

            <button id="return-home-button" class="small-button">
                Trang chủ
            </button>
        </div>

        <div class="game-layout">
            <div class="game-board">
                <table id="game" aria-label="Bảng chơi Pikachu"></table>
                <div id="preview-countdown" class="preview-countdown" hidden>3</div>
            </div>

            <aside id="memory-panel" class="memory-panel" hidden>
                <p class="memory-panel-title">THẺ KÝ ỨC</p>

                <p class="memory-panel-description">
                    Ghép đúng 2 combo để mở thẻ
                </p>

                <button id="memory-button" class="memory-card" type="button"
                        disabled
                        aria-label="Thẻ Ký Ức, cần ghép 2 combo để kích hoạt">
                    <img class="memory-card-image"
                         src="Image/theKiUc.png"
                         alt="Thẻ Ký Ức"
                         onerror="this.style.display='none'">

                    <span id="memory-progress" class="memory-progress"></span>
                    <span id="memory-combo" class="memory-combo">0/2 COMBO</span>
                    <span id="memory-timer" class="memory-timer" hidden>20s</span>
                </button>

                <p id="memory-hint" class="memory-hint">
                    Thẻ đang khóa
                </p>
            </aside>
        </div>

        <p id="game-note" class="game-note">
            Chọn hai ô có hình giống nhau để ghép.
        </p>
    </div>
</section>

<script src="game.js"></script>
</body>
</html>
